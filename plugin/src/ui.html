<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; font: 12px/1.45 Inter, sans-serif; }
      body { margin: 0; padding: 18px; color: var(--figma-color-text); background: var(--figma-color-bg); }
      h1 { margin: 0 0 4px; font-size: 16px; }
      p { margin: 0 0 14px; color: var(--figma-color-text-secondary); }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      button { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 7px 11px; background: var(--figma-color-bg-secondary); color: inherit; cursor: pointer; }
      button.primary { border-color: var(--figma-color-bg-brand); background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      .cleanup { margin-bottom: 14px; padding: 10px; border: 1px solid var(--figma-color-border); border-radius: 6px; }
      .cleanup label { display: block; margin: 8px 0; }
      #status { padding: 10px; border: 1px solid var(--figma-color-border); border-radius: 6px; white-space: pre-wrap; max-height: 360px; overflow: auto; }
      .error { color: var(--figma-color-text-danger); }
    </style>
  </head>
  <body>
    <h1>figma-rust</h1>
    <p>Structural Figma extraction and GPUI compiler diagnostics.</p>
    <div class="actions">
      <button id="extract-compiler" class="primary">Export compiler JSON</button>
      <input id="export-token" type="password" autocomplete="off" placeholder="Bridge export token" />
      <button id="extract-bridge">Export compiler JSON to bridge</button>
      <button id="extract-evidence">Export evidence JSON</button>
      <button id="lint">Lint selection</button>
    </div>
    <div class="cleanup">
      <button id="scan-transfer">Scan temporary transfer nodes</button>
      <label><input id="export-verified" type="checkbox" disabled /> I verified the exported compiler JSON on disk.</label>
      <button id="cleanup-transfer" disabled>Remove temporary transfer nodes</button>
    </div>
    <div id="status">Select a frame or component.</div>
    <script>
      const status = document.getElementById("status");
      const exportVerified = document.getElementById("export-verified");
      const cleanupTransfer = document.getElementById("cleanup-transfer");
      document.getElementById("extract-compiler").onclick = () => parent.postMessage({ pluginMessage: { type: "extract", export_kind: "COMPILER" } }, "*");
      document.getElementById("extract-bridge").onclick = () => parent.postMessage({ pluginMessage: {
        type: "extract-to-bridge",
        export_token: document.getElementById("export-token").value,
      } }, "*");
      document.getElementById("extract-evidence").onclick = () => parent.postMessage({ pluginMessage: { type: "extract", export_kind: "EVIDENCE" } }, "*");
      document.getElementById("lint").onclick = () => parent.postMessage({ pluginMessage: { type: "lint" } }, "*");
      document.getElementById("scan-transfer").onclick = () => parent.postMessage({ pluginMessage: { type: "scan-temporary-transfer-nodes" } }, "*");
      exportVerified.onchange = () => { cleanupTransfer.disabled = !exportVerified.checked; };
      cleanupTransfer.onclick = () => parent.postMessage({ pluginMessage: {
        type: "cleanup-temporary-transfer-nodes",
        export_verified: exportVerified.checked,
      } }, "*");
      const formatBytes = (bytes) => bytes >= 1024 * 1024
        ? `${(bytes / (1024 * 1024)).toFixed(2)} MiB`
        : `${Math.ceil(bytes / 1024)} KiB`;
      const formatSummary = (summary) => {
        const lines = [
          `${summary.root_count} root, ${summary.node_count} node`,
          `${summary.variable_count} variable, ${summary.asset_count} asset`,
          `${summary.diagnostics.errors} error, ${summary.diagnostics.warnings} warning, ${summary.diagnostics.info} info`,
          `Estimated JSON: ${formatBytes(summary.estimated_bytes)}`,
        ];
        if (summary.includes_rest_snapshot) lines.push("Includes JSON_REST_V1 evidence snapshot");
        if (summary.large_selection) lines.push("Large selection: prefer compiler JSON and the file-based CLI");
        if (!summary.bridge_compatible) lines.push("Too large for the 8 MiB loopback bridge; export to a file");
        return lines.join("\n");
      };
      onmessage = ({ data }) => {
        const message = data.pluginMessage;
        if (!message) return;
        if (message.type === "bundle") {
          const json = JSON.stringify(message.bundle, null, 2);
          const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
          const link = document.createElement("a");
          link.href = url;
          link.download = message.export_kind === "EVIDENCE"
            ? "figma-rust-evidence.json"
            : "figma-rust-extraction.json";
          link.click();
          URL.revokeObjectURL(url);
          exportVerified.disabled = false;
          exportVerified.checked = false;
          cleanupTransfer.disabled = true;
          status.textContent = `Exported ${link.download}\nVerify its schema, root ID, byte length, and hash on disk before enabling cleanup.\n${formatSummary(message.summary)}`;
        } else if (message.type === "bundle-preview") {
          const preview = message.bundle.extraction_diagnostics
            .slice(0, 20)
            .map((item) => `[${item.severity}] ${item.code}: ${item.message}`);
          const remaining = message.bundle.extraction_diagnostics.length - preview.length;
          status.textContent = [
            formatSummary(message.summary),
            ...preview,
            ...(remaining > 0 ? [`… ${remaining} additional diagnostics; export or lint for the full list`] : []),
          ].join("\n");
        } else if (message.type === "bridge-export-result") {
          const result = message.result;
          exportVerified.disabled = false;
          exportVerified.checked = false;
          cleanupTransfer.disabled = true;
          status.textContent = [
            `Exported exact compiler JSON to ${result.path}`,
            `Transfer complete: ${result.complete}`,
            `Traversal complete: ${result.traversal_complete ?? "not reported by legacy bundle"}`,
            `Bytes: ${result.byte_length}`,
            `SHA-256: ${result.sha256}`,
            formatSummary(message.summary),
          ].join("\n");
        } else if (message.type === "lint-result") {
          status.textContent = JSON.stringify(message.result, null, 2);
        } else if (message.type === "temporary-transfer-scan") {
          status.textContent = `Found ${message.count} temporary transfer node(s).\n${message.node_ids.join("\n")}`;
        } else if (message.type === "temporary-transfer-cleanup") {
          exportVerified.checked = false;
          exportVerified.disabled = true;
          cleanupTransfer.disabled = true;
          status.textContent = `Removed ${message.result.removed_count} temporary transfer node(s).\n${message.result.removed_node_ids.join("\n")}`;
        } else if (message.type === "error") {
          status.textContent = message.message;
          status.className = "error";
        }
      };
    </script>
  </body>
</html>
