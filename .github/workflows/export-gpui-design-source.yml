name: Export GPUI Design source

on:
  push:
    branches:
      - feat/gpui-design-mcp-foundation
    paths:
      - .github/workflows/export-gpui-design-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            ./ "$RUNNER_TEMP/source/"
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-design-branch-source
          path: ${{ runner.temp }}/source
          if-no-files-found: error
          retention-days: 1
