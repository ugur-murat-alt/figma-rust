name: Windows platform evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - fixtures/generated-gpui/**
      - fixtures/windows-platform/**
      - scripts/capture-windows-platform.ps1
      - scripts/windows-dpi-profile.cpp
      - .github/workflows/windows-platform-evidence.yml

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        dpi: [100, 125, 150]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build DPI helper
        shell: cmd
        run: if not exist target mkdir target && cl /nologo /std:c++20 /EHsc /W4 /WX scripts\windows-dpi-profile.cpp /Fe:target\windows-dpi-profile.exe /link user32.lib
      - name: Configure qualification display
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Start-Sleep -Seconds 2
      - name: Apply and verify display scale
        shell: pwsh
        run: target/windows-dpi-profile.exe ${{ matrix.dpi }} | Set-Content "$env:RUNNER_TEMP/dpi-profile.json"
      - name: Build GPUI probe and verifier
        shell: pwsh
        run: |
          cargo build -p figma-generated-gpui-fixture --features capture-real-window --bin windows-platform-probe
          cargo build -p figma-rust-cli
      - name: Capture render, input, font, and DPI evidence
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/windows-${{ matrix.dpi }}"
          scripts/capture-windows-platform.ps1 -DpiPercent ${{ matrix.dpi }} `
            -Executable "target/debug/windows-platform-probe.exe" -OutputDirectory $out
          Copy-Item fixtures/windows-platform/probe.geometry.json "$out/reference.geometry.json"
          Copy-Item fixtures/windows-platform/probe.geometry.json "$out/actual.geometry.json"
          $thresholds = [ordered]@{
            geometry_absolute_px = 0.0; geometry_relative = 0.0
            mean_absolute_pixel_error = 0.00002; changed_pixel_ratio = 0.0005
            edge_error = 0.0001; minimum_ssim = 0.9999
          }
          @{
            reference_geometry = 'reference.geometry.json'
            actual_geometry = 'actual.geometry.json'
            reference_image = 'run-1.png'
            actual_image = 'run-2.png'
            thresholds = $thresholds
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$out/verify.json"
          target/debug/figma-rust verify "$out/verify.json" --json | Set-Content -Encoding utf8 "$out/verify.report.json"
          $report = Get-Content "$out/verify.report.json" | ConvertFrom-Json
          if (-not $report.passed) { throw 'Windows verifier failed' }
          $evidence = Get-Content "$out/windows-platform-evidence.json" | ConvertFrom-Json
          $evidence | Add-Member -NotePropertyName verification -NotePropertyValue ([ordered]@{
            manifest_sha256 = (Get-FileHash "$out/verify.json" -Algorithm SHA256).Hash.ToLowerInvariant()
            report_sha256 = (Get-FileHash "$out/verify.report.json" -Algorithm SHA256).Hash.ToLowerInvariant()
            thresholds = $thresholds
            image_metrics = $report.image_metrics
          })
          $evidence | Add-Member -NotePropertyName passed -NotePropertyValue $true
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$out/windows-platform-evidence.json"
          Copy-Item "$env:RUNNER_TEMP/dpi-profile.json" "$out/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-platform-${{ matrix.dpi }}
          path: ${{ runner.temp }}/windows-${{ matrix.dpi }}
          if-no-files-found: error
          retention-days: 14
      - name: Restore 100 percent scale
        if: always()
        shell: pwsh
        run: if (Test-Path target/windows-dpi-profile.exe) { target/windows-dpi-profile.exe 100 }
