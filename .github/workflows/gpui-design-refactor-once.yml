name: GPUI Design refactor once

on:
  push:
    branches:
      - feat/gpui-design-mcp-foundation
    paths:
      - .github/workflows/gpui-design-refactor-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.repository == 'ugur-murat-alt/figma-rust'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpui-design-mcp-foundation
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Apply reviewed authoring-core refactor
        shell: bash
        run: |
          cat > /tmp/gpui-design-refactor.patch.gz.b64 <<'PATCH'

PATCH
          base64 --decode /tmp/gpui-design-refactor.patch.gz.b64 | gzip --decompress > /tmp/gpui-design-refactor.patch
          git apply --check /tmp/gpui-design-refactor.patch
          git apply /tmp/gpui-design-refactor.patch
          cargo +1.97.1 fmt --all
      - name: Commit refactor
        shell: bash
        run: |
          git add crates/gpui-design-core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor(gpui-design): harden validation contracts"
          git push origin HEAD:feat/gpui-design-mcp-foundation
