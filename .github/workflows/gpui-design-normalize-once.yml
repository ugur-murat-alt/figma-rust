name: GPUI Design normalize once

on:
  push:
    branches:
      - feat/gpui-design-mcp-foundation
    paths:
      - .github/workflows/gpui-design-normalize-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'ugur-murat-alt/figma-rust'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpui-design-mcp-foundation
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Normalize new Rust crates and lockfile
        run: |
          cargo +1.97.1 fmt --all
          cargo +1.97.1 metadata --no-deps --format-version 1 >/dev/null
      - name: Commit deterministic normalization
        run: |
          git add Cargo.lock crates/gpui-design-core crates/gpui-design-mcp
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(gpui-design): normalize Rust sources and lockfile"
          git push origin HEAD:feat/gpui-design-mcp-foundation
